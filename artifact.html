/**
 * Display formatters.
 *
 * Kept separate from calculation logic: these functions only turn numbers into
 * strings for the UI, never derive new values.
 */

/** "4.8★" — a rating always renders to one decimal so 4.8 and 4.80 never mix. */
function formatRating(rating) {
  return `${rating.toFixed(1)}★`;
}

/**
 * "+0.4★" / "−0.2★" — a signed delta.
 * Uses a true minus sign (−) rather than a hyphen so figures align optically.
 */
function formatRatingDelta(delta) {
  const rounded = Math.abs(delta).toFixed(1);
  if (Number(rounded) === 0) return '0.0★';
  return `${delta > 0 ? '+' : '−'}${rounded}★`;
}

/** "+7%" / "−3%" — a signed percentage, already expressed in whole points. */
function formatSignedPercent(percent) {
  return `${percent > 0 ? '+' : '−'}${Math.abs(percent)}%`;
}

/** "72%" — a 0–1 ratio rendered as a whole percentage. */
function formatRatio(ratio) {
  return `${Math.round(ratio * 100)}%`;
}

/** "$985" — whole dollars with thousands separators. */
function formatCurrency(amount) {
  return `$${Math.round(amount).toLocaleString('en-US')}`;
}

/** "Top 25%" — turns a percentile rank into the phrase a manager actually uses. */
function formatPercentileRank(percentile) {
  return `Top ${100 - percentile}%`;
}

/** "May" — short month label for chart axes. */
function formatMonthLabel(isoDate) {
  return new Date(`${isoDate}T00:00:00`).toLocaleDateString('en-US', { month: 'short' });
}

/** "15 May 2026" — long form for timestamps the user typed or confirmed. */
function formatLongDate(isoDate) {
  return new Date(`${isoDate}T00:00:00`).toLocaleDateString('en-GB', {
    day: 'numeric',
    month: 'long',
    year: 'numeric',
  });
}

/**
 * Derived portfolio metrics.
 *
 * Every figure the dashboard claims is calculated here from the raw records in
 * `mockData.js`. Nothing on screen is a hardcoded headline number, so the demo
 * stays internally consistent even when the underlying mock data is edited.
 *
 * All functions are pure: same input, same output, no React, no side effects.
 */


/** Mean overall rating across the managed portfolio. */
function calculatePortfolioAverageRating(properties) {
  const total = properties.reduce((sum, property) => sum + property.overallRating, 0);
  return total / properties.length;
}

/**
 * How far a property sits above or below its own portfolio's average.
 * This is the "internal benchmark" — a manager's first question is always
 * "is this one dragging the rest down?".
 */
function calculateInternalDelta(property, properties) {
  return property.overallRating - calculatePortfolioAverageRating(properties);
}

/** All monthly snapshots for one category, oldest first. */
function getCategoryHistory(property, category) {
  return property.ratingHistory
    .filter((entry) => entry.category === category)
    .sort((a, b) => a.date.localeCompare(b.date));
}

/**
 * Would a trend line drawn from this history be honest?
 *
 * Too few months or too few underlying reviews and the answer is no — the UI
 * shows a "Gathering data" state instead of a chart that implies certainty the
 * sample cannot support.
 */
function hasEnoughDataToPlot(history) {
  const totalReviews = history.reduce((sum, entry) => sum + entry.reviewCount, 0);
  return (
    history.length >= CHART_CONFIDENCE_THRESHOLDS.minimumDataPoints &&
    totalReviews >= CHART_CONFIDENCE_THRESHOLDS.minimumTotalReviews
  );
}

/**
 * Split a category history at the date the fix went live.
 *
 * ISO date strings compare correctly as plain strings, so no Date parsing is
 * needed. A snapshot dated *after* the implementation counts as "after".
 */
function splitHistoryAtImplementation(history, implementedDate) {
  return {
    before: history.filter((entry) => entry.date <= implementedDate),
    after: history.filter((entry) => entry.date > implementedDate),
  };
}

/** Mean of a `rating` collection, or null when there is nothing to average. */
function averageRating(entries) {
  if (entries.length === 0) return null;
  const total = entries.reduce((sum, entry) => sum + entry.rating, 0);
  return total / entries.length;
}

/** Total reviews backing a set of snapshots — the `n=` behind a claim. */
function totalReviews(entries) {
  return entries.reduce((sum, entry) => sum + entry.reviewCount, 0);
}

/**
 * The core ROI calculation: what did the rating do before the change, and what
 * has it done since? Returns null when either side of the split is empty, so a
 * caller can never accidentally render a one-sided "lift".
 */
function calculateRatingLift(history, implementedDate) {
  const { before, after } = splitHistoryAtImplementation(history, implementedDate);
  const beforeAverage = averageRating(before);
  const afterAverage = averageRating(after);

  if (beforeAverage === null || afterAverage === null) return null;

  return {
    beforeAverage,
    afterAverage,
    delta: afterAverage - beforeAverage,
    beforeReviews: totalReviews(before),
    afterReviews: totalReviews(after),
    // A lift is only "sustained" once enough reviews have landed since the fix.
    // Below the threshold the number is directional, and the UI must say so.
    isSustained: totalReviews(after) >= revenueModel.sustainedReviewThreshold,
  };
}

/**
 * Reshape a category history into rows Recharts can draw as two coloured
 * segments meeting at the implementation boundary.
 *
 * The final "before" point deliberately carries *both* keys so the two lines
 * join without a visual gap. Without this the chart would show a break that
 * looks like missing data rather than a change of state.
 */
function buildBeforeAfterSeries(history, implementedDate) {
  const lastBeforeIndex = implementedDate
    ? history.reduce(
        (lastIndex, entry, index) => (entry.date <= implementedDate ? index : lastIndex),
        -1,
      )
    : -1;

  return history.map((entry, index) => {
    const isBefore = lastBeforeIndex >= 0 && index <= lastBeforeIndex;
    const isJoiningPoint = index === lastBeforeIndex;

    return {
      date: entry.date,
      reviewCount: entry.reviewCount,
      rating: entry.rating,
      // When there is no implementation date at all, everything renders as a
      // single "current trend" line via the `after` key.
      ratingBefore: lastBeforeIndex >= 0 && isBefore ? entry.rating : null,
      ratingAfter: lastBeforeIndex < 0 || !isBefore || isJoiningPoint ? entry.rating : null,
    };
  });
}

/** The x-axis tick the implementation marker sits on: the last "before" point. */
function findImplementationBoundaryDate(history, implementedDate) {
  const beforeEntries = history.filter((entry) => entry.date <= implementedDate);
  if (beforeEntries.length === 0) return null;
  return beforeEntries[beforeEntries.length - 1].date;
}

/**
 * Portfolio-level realised impact — the hero metric.
 *
 * Deliberately conservative, because the headline number is the product's
 * credibility:
 *   • only Implemented actions count;
 *   • the category must have a real before *and* after sample;
 *   • revenue is credited once per property, never once per action, so a
 *     property with three fixes is not counted three times.
 */
function calculatePortfolioImpact(properties, actionItems) {
  const propertiesById = new Map(properties.map((property) => [property.id, property]));
  const ratingLifts = [];
  const propertyIdsWithSustainedLift = new Set();

  actionItems
    .filter((item) => item.status === 'Implemented' && item.implementedDate)
    .forEach((item) => {
      const property = propertiesById.get(item.propertyId);
      if (!property) return;

      const history = getCategoryHistory(property, item.category);
      const lift = calculateRatingLift(history, item.implementedDate);
      if (!lift) return;

      ratingLifts.push(lift.delta);
      if (lift.isSustained) propertyIdsWithSustainedLift.add(property.id);
    });

  // Revenue model: a sustained lift is assumed to buy +3 pts of occupancy,
  // which is then priced at that property's own nightly rate.
  const estimatedMonthlyRevenue = [...propertyIdsWithSustainedLift].reduce((sum, propertyId) => {
    const property = propertiesById.get(propertyId);
    const addedRoomNights = revenueModel.occupancyUpliftPoints * revenueModel.nightsPerMonth;
    return sum + addedRoomNights * property.adr;
  }, 0);

  const averageRatingLift =
    ratingLifts.length > 0
      ? ratingLifts.reduce((sum, delta) => sum + delta, 0) / ratingLifts.length
      : 0;

  return {
    averageRatingLift,
    // Rounded to the nearest $10 — false precision on a modelled figure would
    // imply an accuracy the assumptions do not have.
    estimatedMonthlyRevenue: Math.round(estimatedMonthlyRevenue / 10) * 10,
    implementedActionCount: ratingLifts.length,
    propertiesImprovedCount: propertyIdsWithSustainedLift.size,
  };
}

/**
 * Queries and view-state merging for action items.
 *
 * These are pure list transforms, kept out of the components so the panel stays
 * a rendering concern and the filtering rules can be reasoned about (or tested)
 * on their own.
 */

/** Sentinel meaning "do not narrow on this dimension". */
const ALL_FILTER_VALUE = 'all';

/**
 * Fold the user's in-session edits over the source data.
 *
 * Marking an item implemented sets both the date and the status together — they
 * are one fact, and letting them drift apart is how a queue ends up showing
 * "New" next to an implementation date.
 */
function applyImplementationOverrides(actionItems, implementationOverrides) {
  return actionItems.map((actionItem) => {
    const overriddenDate = implementationOverrides[actionItem.id];
    if (!overriddenDate) return actionItem;

    return { ...actionItem, status: 'Implemented', implementedDate: overriddenDate };
  });
}

/** Narrow the queue by property, category and status independently. */
function filterActionItems(actionItems, filters) {
  return actionItems.filter((actionItem) => {
    const matchesProperty =
      filters.propertyId === ALL_FILTER_VALUE || actionItem.propertyId === filters.propertyId;
    const matchesCategory =
      filters.category === ALL_FILTER_VALUE || actionItem.category === filters.category;
    const matchesStatus =
      filters.status === ALL_FILTER_VALUE || actionItem.status === filters.status;

    return matchesProperty && matchesCategory && matchesStatus;
  });
}

/**
 * The lifecycle of a single recommendation: detected → implemented → measured.

 * This is the product's retention loop rendered literally. A manager can see at
 * a glance which stage a fix is at, and — critically — that "measured" is a real
 * stage that takes time rather than something the tool claims instantly.
 */

/** One node on the timeline. A completed step is filled; a pending one is hollow. */
function TimelineStep({ title, detail, isComplete, isLast }) {
  return (
    <li className="flex flex-1 items-start gap-3">
      <div className="flex flex-col items-center self-stretch">
        <span
          className={`mt-0.5 h-2.5 w-2.5 shrink-0 rounded-full border-2 ${

          aria-hidden="true"
        />

        <p

        >
          {title}
        </p>
        <p className="mt-0.5 text-xs text-[var(--ink-muted)]">{detail}</p>
      </div>

      {/* Connector between nodes, omitted after the final step. */}
      {!isLast && <span className="mt-2 hidden h-px flex-1 bg-[var(--border)] sm:block" aria-hidden="true" />}
    </li>
  );
}

function ImplementationTimeline({ actionItem, reviewsSinceImplementation }) {
  const isImplemented = Boolean(actionItem.implementedDate);
  const hasMeasurement = isImplemented && reviewsSinceImplementation > 0;

  return (
    <ol className="flex flex-col gap-4 sm:flex-row sm:items-start sm:gap-2">
      <TimelineStep
        title="Detected"
        detail={`${actionItem.category} signal in guest reviews`}
        isComplete
      />
      <TimelineStep
        title="Implemented"
        detail={

        }

      <TimelineStep
        title="Measured"
        detail={

/**

function ImplementationControl({ actionItem, onMarkImplemented }) {

          />

        <button

          className="rounded-lg bg-[var(--accent)] px-3 py-1.5 text-sm font-medium text-white transition-colors hover:bg-[var(--accent-strong)]"

          Confirm

          onClick={handleCancel}

        >
          Cancel
        </button>

        <p className="w-full text-xs text-[var(--ink-secondary)]">
          The chart splits at this date — reviews after it count as evidence of the change.
        </p>
      </div>
    );
  }

  if (actionItem.implementedDate) {
    return (
      <div className="flex flex-wrap items-center gap-3">
        <p className="text-xs text-[var(--ink-secondary)]">

      className="rounded-lg border border-[var(--accent)] px-3 py-1.5 text-sm font-medium text-[var(--accent)] transition-colors hover:bg-[var(--accent-wash)]"

/**
 * The proof chart: one category rating over time, split into a "before" and an
 * "after" segment at the date the fix went live.
 *
 * Encoding choices worth stating, because they are the difference between a
 * chart that argues and a chart that decorates:
 *   • the before segment is a recessive neutral and the after segment carries
 *     the accent, so attention lands on the outcome rather than the history;
 *   • the sample size (`n=`) sits under every point — a jump built on 3 reviews
 *     and a jump built on 30 must not look identical;
 *   • the reference line is dashed because it marks a threshold in time, which
 *     is the one thing in this chart that legitimately is not data.
 */

/** Horizontal nudge applied to the one label that would sit under the marker. */
const BOUNDARY_LABEL_OFFSET_X = -16;

/**
 * Small muted `n=` beneath each point, so sample size is never hidden in a
 * tooltip.
 *
 * Two legibility details:
 *   • the glyphs are painted over a surface-coloured outline
 *     (`paintOrder="stroke"`), knocking a halo out of any gridline behind them;
 *   • the label on the boundary point is nudged left, because the implementation
 *     marker is drawn above the label layer and would otherwise strike through
 *     it. Left is the correct direction — that point is the last "before"
 *     reading, so the label moves into the region it belongs to.
 */
function ReviewCountLabel({ x, y, value, index, boundaryIndex }) {
  const offsetX = index === boundaryIndex ? BOUNDARY_LABEL_OFFSET_X : 0;

  return (
    <text
      x={x + offsetX}
      y={y + 17}
      textAnchor="middle"
      fontSize={10}
      stroke={CHART_COLORS.surface}
      strokeWidth={3}
      paintOrder="stroke"
      style={{ fill: CHART_COLORS.axisText }}
    >
      n={value}
    </text>
  );
}

/** Hover card: the value, its sample size, and which side of the change it sits on. */
function ChartTooltip({ active, payload, implementedDate }) {
  if (!active || !payload || payload.length === 0) return null;

  const point = payload[0].payload;
  const period = !implementedDate ? 'Current trend' : point.date <= implementedDate ? 'Before' : 'After';

  return (
    <div className="rounded-lg border border-[var(--border)] bg-[var(--surface)] px-3 py-2 text-xs shadow-lg">
      <div className="font-semibold text-[var(--ink-primary)]">{formatMonthLabel(point.date)}</div>
      <div className="mt-1 text-[var(--ink-secondary)]">
        {formatRating(point.rating)} · n={point.reviewCount} reviews
      </div>
      <div className="mt-0.5 text-[var(--ink-muted)]">{period}</div>
    </div>
  );
}

/** Always-present legend. Identity is never carried by colour alone. */
function ChartLegend({ hasImplementation }) {
  const entries = hasImplementation
    ? [
        { label: 'Before change', color: CHART_COLORS.before },
        { label: 'After change', color: CHART_COLORS.after },
      ]
    : [{ label: 'Current trend', color: CHART_COLORS.after }];

  return (
    <ul className="flex flex-wrap items-center gap-4">
      {entries.map((entry) => (
        <li key={entry.label} className="flex items-center gap-1.5">
          <span
            className="h-0.5 w-4 rounded-full"
            style={{ backgroundColor: entry.color }}
            aria-hidden="true"
          />
          <span className="text-xs text-[var(--ink-secondary)]">{entry.label}</span>
        </li>
      ))}
    </ul>
  );
}

/** The WCAG-clean twin of the chart — every plotted value, readable as text. */
function ChartTableView({ series, implementedDate }) {
  return (
    <table className="w-full text-left text-xs">
      <thead>
        <tr className="border-b border-[var(--border)] text-[var(--ink-muted)]">
          <th scope="col" className="py-2 font-medium">Month</th>
          <th scope="col" className="py-2 font-medium tabular-nums">Rating</th>
          <th scope="col" className="py-2 font-medium tabular-nums">Reviews</th>
          <th scope="col" className="py-2 font-medium">Period</th>
        </tr>
      </thead>
      <tbody>
        {series.map((point) => (
          <tr key={point.date} className="border-b border-[var(--border)] last:border-0">
            <td className="py-1.5 text-[var(--ink-secondary)]">{formatMonthLabel(point.date)}</td>
            <td className="py-1.5 tabular-nums text-[var(--ink-primary)]">
              {point.rating.toFixed(1)}
            </td>
            <td className="py-1.5 tabular-nums text-[var(--ink-secondary)]">{point.reviewCount}</td>
            <td className="py-1.5 text-[var(--ink-muted)]">
              {!implementedDate ? '—' : point.date <= implementedDate ? 'Before' : 'After'}
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function BeforeAfterChart({ series, boundaryDate, implementedDate }) {
  const [isTableVisible, setIsTableVisible] = useState(false);

  // Leave clearance beneath the lowest point so the `n=` labels never collide
  // with the axis, and cap the scale at 5 because a rating cannot exceed it.
  const lowestRating = Math.min(...series.map((point) => point.rating));
  const yAxisDomain = [Math.max(3, Math.floor((lowestRating - 0.4) * 10) / 10), 5];

  // The point the implementation marker is drawn on, so its label can dodge it.
  const boundaryIndex = series.findIndex((point) => point.date === boundaryDate);

  return (
    <div>
      <div className="mb-3 flex flex-wrap items-center justify-between gap-3">
        <ChartLegend hasImplementation={Boolean(implementedDate)} />
        <button
          type="button"
          onClick={() => setIsTableVisible((previous) => !previous)}
          className="text-xs font-medium text-[var(--accent)] underline-offset-2 hover:underline"
        >
          {isTableVisible ? 'Hide table' : 'View as table'}
        </button>
      </div>

      <ResponsiveContainer width="100%" height={260}>
        <LineChart data={series} margin={{ top: 12, right: 16, bottom: 8, left: -12 }}>
          <CartesianGrid stroke={CHART_COLORS.grid} strokeWidth={1} vertical={false} />

          <XAxis
            dataKey="date"
            tickFormatter={formatMonthLabel}
            tick={{ fontSize: 11, fill: CHART_COLORS.axisText }}
            axisLine={{ stroke: CHART_COLORS.axis }}
            tickLine={false}
            tickMargin={22}
          />
          <YAxis
            domain={yAxisDomain}
            tickCount={5}
            tickFormatter={(value) => value.toFixed(1)}
            tick={{ fontSize: 11, fill: CHART_COLORS.axisText }}
            axisLine={false}
            tickLine={false}
            width={48}
          />

          <Tooltip
            content={<ChartTooltip implementedDate={implementedDate} />}
            cursor={{ stroke: CHART_COLORS.axis, strokeWidth: 1 }}
          />

          {/* The moment of change. Dashed because it is a threshold, not data. */}
          {boundaryDate && (
            <ReferenceLine
              x={boundaryDate}
              stroke={CHART_COLORS.after}
              strokeDasharray="4 4"
              strokeWidth={1}
              // Render behind the data layer so the marker never strikes
              // through a data point or its sample-size label.
              isFront={false}
              label={{
                value: 'Implemented',
                position: 'top',
                fontSize: 10,
                fill: CHART_COLORS.after,
              }}
            />
          )}

          {/* Animation is off deliberately. Recharts draws a line by animating
              its stroke-dasharray from zero, so an un-run animation renders an
              invisible chart — which is what a reader with reduced-motion
              settings, a print stylesheet, or a static screenshot would get. */}
          <Line
            type="monotone"
            dataKey="ratingBefore"
            stroke={CHART_COLORS.before}
            strokeWidth={CHART_GEOMETRY.strokeWidth}
            isAnimationActive={false}
            dot={{
              r: CHART_GEOMETRY.dotRadius,
              fill: CHART_COLORS.before,
              stroke: CHART_COLORS.marker,
              strokeWidth: CHART_GEOMETRY.markerRingWidth,
            }}
            activeDot={{ r: CHART_GEOMETRY.activeDotRadius }}
          />
          <Line
            type="monotone"
            dataKey="ratingAfter"
            stroke={CHART_COLORS.after}
            strokeWidth={CHART_GEOMETRY.strokeWidth}
            isAnimationActive={false}
            dot={{
              r: CHART_GEOMETRY.dotRadius,
              fill: CHART_COLORS.after,
              stroke: CHART_COLORS.marker,
              strokeWidth: CHART_GEOMETRY.markerRingWidth,
            }}
            activeDot={{ r: CHART_GEOMETRY.activeDotRadius }}
          />

          {/* Invisible carrier line: renders one `n=` label per point, exactly
              once, positioned against the real rating value. */}
          <Line
            dataKey="rating"
            stroke="none"
            dot={false}
            activeDot={false}
            isAnimationActive={false}
          >
            <LabelList
              dataKey="reviewCount"
              content={(labelProps) => (
                <ReviewCountLabel {...labelProps} boundaryIndex={boundaryIndex} />
              )}
            />
          </Line>
        </LineChart>
      </ResponsiveContainer>

      {isTableVisible && (
        <div className="mt-4 border-t border-[var(--border)] pt-3">
          <ChartTableView series={series} implementedDate={implementedDate} />
        </div>
      )}
    </div>
  );
}

/** Before → After → delta, with the sample size behind each side. */
function RatingLiftSummary({ lift }) {

      <div>
        <div className="text-lg font-semibold text-[var(--ink-secondary)]">

        </div>
        <div className="text-xs text-[var(--ink-muted)]">Before · n={lift.beforeReviews}</div>
      </div>

      <span className="text-[var(--ink-muted)]" aria-hidden="true">
        →
      </span>

      <div>
        <div className="text-lg font-semibold text-[var(--ink-primary)]">
          {formatRating(lift.afterAverage)}
        </div>
        <div className="text-xs text-[var(--ink-muted)]">After · n={lift.afterReviews}</div>
      </div>

      <div className="rounded-lg bg-[var(--accent-wash)] px-3 py-2">
        <div className="text-lg font-semibold text-[var(--accent-strong)]">
          {formatRatingDelta(lift.delta)}
        </div>
        <div className="text-xs text-[var(--ink-secondary)]">category rating</div>
      </div>
    </div>

}

/**
 * The caveat that keeps the panel honest. A lift measured on a handful of
 * reviews is a signal worth watching, not a result worth reporting to an owner.
 */
function EvidenceStrengthNote({ lift }) {
  if (lift.isSustained) {
    return (
      <p className="text-xs leading-relaxed text-[var(--ink-secondary)]">
        Based on {lift.afterReviews} reviews since the change — enough to treat this lift as
        sustained.
      </p>
    );

  return (
    <p className="rounded-lg bg-[var(--status-warning-wash)] px-3 py-2 text-xs leading-relaxed text-[var(--status-warning-text)]">
      Directional only: {lift.afterReviews} review
      {lift.afterReviews === 1 ? '' : 's'} since the change, below the{' '}
      {revenueModel.sustainedReviewThreshold}-review bar this product uses before calling a lift
      proven.

/** Shown before the user has picked anything — the panel explains its own input. */
function NoSelectionState() {

    <p className="px-6 py-16 text-center text-sm text-[var(--ink-muted)]">
      Select an action item above to see whether it moved the rating.
    </p>

function EffectivenessTracker({
  selectedAction,
  property,
  pricingRecommendation,
  isPricingDismissed,
  onMarkImplemented,
  onDismissPricing,

  if (!selectedAction || !property) {
    return (
      <Card>
        <SectionHeader

          title="Effectiveness & pricing tracker"
          description="Before/after evidence that a completed action changed the rating it was meant to change."
        />
        <NoSelectionState />

  const categoryHistory = getCategoryHistory(property, selectedAction.category);
  const canPlot = hasEnoughDataToPlot(categoryHistory);
  const { implementedDate } = selectedAction;

  const lift = implementedDate ? calculateRatingLift(categoryHistory, implementedDate) : null;
  const boundaryDate = implementedDate
    ? findImplementationBoundaryDate(categoryHistory, implementedDate)
    : null;
  const series = buildBeforeAfterSeries(categoryHistory, implementedDate);

  // undismissed state, and enough post-change reviews to stand behind.
  const shouldShowPricing =

  return (
    <Card>
      <SectionHeader
        act="Prove"
        title="Effectiveness & pricing tracker"
        description="Before/after evidence that a completed action changed the rating it was meant to change."
      />

        <div className="flex flex-wrap items-start justify-between gap-4">

                <EvidenceStrengthNote lift={lift} />
              </div>
            ) : (
              <p className="text-xs leading-relaxed text-[var(--ink-secondary)]">
                Not yet implemented — the line below is the current trend. Mark an implementation
                date to split it into before and after.
              </p>
            )}

            <BeforeAfterChart
              series={series}
              boundaryDate={boundaryDate}
              implementedDate={implementedDate}
            />

            {shouldShowPricing && (
              <PricingSuggestion
                recommendation={pricingRecommendation}
                property={property}
                onDismiss={() => onDismissPricing(property.id)}
              />
            )}
          </div>
        ) : (
          <GatheringDataState
            dataPointCount={categoryHistory.length}
            totalReviews={categoryHistory.reduce((sum, entry) => sum + entry.reviewCount, 0)}
          />
        )}
      </div>
    </Card>
  );
}

/**
 * Compare — where anonymised local top performers beat this property, and what
 * they appear to be doing about it.
 *
 * Form note: the score comparison is drawn as a dot plot, not bars. Bars must
 * start at zero, and a 0–5 bar makes 4.4 and 4.9 look identical; a dot plot
 * legitimately uses a zoomed domain, so the gap that matters stays visible
 * without exaggerating it. The domain endpoints are labelled so the zoom is
 * declared rather than hidden.
 */

/** Position a value on the plot's domain as a percentage of its width. */
function positionOnScale(value, domainMin, domainMax) {
  return ((value - domainMin) / (domainMax - domainMin)) * 100;
}

/** Two points on one scale, with the gap between them shaded. */
function ScoreGapPlot({ yourScore, competitorScore, category }) {
  // A zoomed but declared domain: padded below the lower score, capped at 5.
  const domainMin = Math.min(4, Math.floor((Math.min(yourScore, competitorScore) - 0.2) * 10) / 10);
  const domainMax = 5;

  const yourPosition = positionOnScale(yourScore, domainMin, domainMax);
  const competitorPosition = positionOnScale(competitorScore, domainMin, domainMax);

  return (
    <figure className="m-0">
      <figcaption className="mb-4 text-xs text-[var(--ink-secondary)]">
        {category} score · you vs anonymised local top decile
      </figcaption>

      <div className="relative h-10">
        {/* Track */}
        <div className="absolute top-4 h-0.5 w-full rounded-full bg-[var(--grid)]" />

        {/* The gap itself — the only part of the track that is coloured. */}
        <div
          className="absolute top-4 h-0.5 rounded-full bg-[var(--accent)] opacity-40"
          style={{
            left: `${Math.min(yourPosition, competitorPosition)}%`,
            width: `${Math.abs(competitorPosition - yourPosition)}%`,
          }}
        />

        {/* Your score — recessive neutral. */}
        <div
          className="absolute top-4 flex -translate-x-1/2 -translate-y-1/2 flex-col items-center"
          style={{ left: `${yourPosition}%` }}
        >
          <span className="h-3 w-3 rounded-full border-2 border-[var(--surface)] bg-[var(--ink-muted)]" />
        </div>

        {/* Market score — the accent, because it is the target. */}
        <div
          className="absolute top-4 flex -translate-x-1/2 -translate-y-1/2 flex-col items-center"
          style={{ left: `${competitorPosition}%` }}
        >
          <span className="h-3 w-3 rounded-full border-2 border-[var(--surface)] bg-[var(--accent)]" />
        </div>

        {/* Domain endpoints, so the zoomed scale is explicit. */}
        <span className="absolute top-7 left-0 text-[10px] tabular-nums text-[var(--ink-muted)]">
          {domainMin.toFixed(1)}
        </span>
        <span className="absolute top-7 right-0 text-[10px] tabular-nums text-[var(--ink-muted)]">
          {domainMax.toFixed(1)}
        </span>
      </div>

      {/* Direct labels — identity never rests on colour alone. */}
      <ul className="mt-3 flex flex-wrap items-center gap-x-6 gap-y-2">
        <li className="flex items-center gap-2">
          <span className="h-2.5 w-2.5 rounded-full bg-[var(--ink-muted)]" aria-hidden="true" />
          <span className="text-xs text-[var(--ink-secondary)]">
            You <span className="font-semibold text-[var(--ink-primary)]">{formatRating(yourScore)}</span>
          </span>
        </li>
        <li className="flex items-center gap-2">
          <span className="h-2.5 w-2.5 rounded-full bg-[var(--accent)]" aria-hidden="true" />
          <span className="text-xs text-[var(--ink-secondary)]">
            Local top decile{' '}
            <span className="font-semibold text-[var(--ink-primary)]">
              {formatRating(competitorScore)}
            </span>
          </span>
        </li>
      </ul>
    </figure>
  );
}

/**
 * What the top performers' guests actually praise, by mention count.
 * Bars are zero-based here because frequency is a true magnitude.
 */
function PositiveKeywords({ keywords }) {
  const highestFrequency = Math.max(...keywords.map((entry) => entry.frequency));

  return (
    <div>
      <h4 className="eyebrow text-xs font-semibold tracking-widest text-[var(--ink-muted)] uppercase">
        Recurring praise nearby
      </h4>

      <ul className="mt-3 space-y-2">
        {keywords.map((entry) => (
          <li key={entry.keyword} className="flex items-center gap-3">
            <span className="w-36 shrink-0 truncate text-xs text-[var(--ink-secondary)]">
              {entry.keyword}
            </span>
            <span className="h-1.5 flex-1 overflow-hidden rounded-full bg-[var(--surface-sunken)]">
              <span
                className="block h-full rounded-full bg-[var(--accent)] opacity-70"
                style={{ width: `${(entry.frequency / highestFrequency) * 100}%` }}
              />
            </span>
            <span className="w-6 shrink-0 text-right text-xs tabular-nums text-[var(--ink-muted)]">
              {entry.frequency}
            </span>
          </li>
        ))}
      </ul>
    </div>
  );
}

function CompetitiveGap({ benchmark }) {
  return (
    <div className="space-y-6 rounded-lg border border-[var(--border)] p-5">
      <div>
        <h3 className="text-sm font-semibold text-[var(--ink-primary)]">Competitive gap</h3>
        <p className="mt-1 text-xs leading-relaxed text-[var(--ink-secondary)]">
          Compared against {benchmark.competitorDescriptor}. Competitors are anonymised by type and
          distance only — the pattern is the product, not the neighbour's identity.
        </p>
      </div>

      <ScoreGapPlot
        yourScore={benchmark.yourCategoryScore}
        competitorScore={benchmark.competitorCategoryScore}
        category={benchmark.weakestCategory}
      />

      <PositiveKeywords keywords={benchmark.positiveKeywords} />

      {/* The takeaway: one thing to do, not a list of observations. */}
      <div className="rounded-lg bg-[var(--accent-wash)] p-4">
        <h4 className="eyebrow text-xs font-semibold tracking-widest text-[var(--accent-strong)] uppercase">
          Suggested best practice
        </h4>
        <p className="mt-2 text-sm leading-relaxed text-[var(--ink-primary)]">
          {benchmark.suggestedBestPractice}
        </p>
      </div>
    </div>
  );
}

/**
 * Compare — one property, three questions.
 *
 *   1. Internal: is this unit dragging my own portfolio down?
 *   2. External: how does it sit against the local market?
 *   3. Gap: where specifically am I losing, and what do the winners do?
 *
 * Merging all three into one module matters: a manager who only sees the
 * internal view over-invests in their weakest unit even when it already beats
 * the neighbourhood.
 */

/**
 * Internal benchmark. The colour carries meaning here (above/below average), so
 * it uses the reserved status palette — and always alongside the word, never
 * colour alone.
 */
function InternalBenchmark({ internalDelta, portfolioAverage }) {
  const isAboveAverage = internalDelta >= 0;
  const toneClass = isAboveAverage
    ? 'text-[var(--status-good-text)]'
    : 'text-[var(--status-critical)]';

  return (
    <div className="rounded-lg border border-[var(--border)] p-5">
      <h3 className="eyebrow text-xs font-semibold tracking-widest text-[var(--ink-muted)] uppercase">
        Internal benchmark
      </h3>

      <p className={`mt-3 text-2xl font-semibold tracking-tight ${toneClass}`}>
        {formatRatingDelta(internalDelta)}
      </p>

      <p className="mt-1 text-sm text-[var(--ink-secondary)]">
        {isAboveAverage ? 'above' : 'below'} portfolio average
      </p>

      <p className="mt-3 border-t border-[var(--border)] pt-3 text-xs text-[var(--ink-muted)]">
        Portfolio average is {formatRating(portfolioAverage)} across all managed units.
      </p>
    </div>
  );
}

/** External benchmark: rank against the local market, on a zero-based track. */
function ExternalBenchmark({ percentile, competitorDescriptor }) {
  return (
    <div className="rounded-lg border border-[var(--border)] p-5">
      <h3 className="eyebrow text-xs font-semibold tracking-widest text-[var(--ink-muted)] uppercase">
        External benchmark
      </h3>

      <p className="mt-3 text-2xl font-semibold tracking-tight text-[var(--ink-primary)]">
        {formatPercentileRank(percentile)}
      </p>

      <p className="mt-1 text-sm text-[var(--ink-secondary)]">in the local market</p>

      {/* Percentile track — 0 to 100, so a filled bar is an honest encoding. */}
      <div className="mt-4">
        <div className="h-1.5 w-full overflow-hidden rounded-full bg-[var(--surface-sunken)]">
          <div
            className="h-full rounded-full bg-[var(--accent)]"
            style={{ width: `${percentile}%` }}
          />
        </div>
        <div className="mt-1.5 flex justify-between text-[10px] tabular-nums text-[var(--ink-muted)]">
          <span>0th</span>
          <span>{percentile}th percentile</span>
          <span>100th</span>
        </div>
      </div>

      <p className="mt-3 border-t border-[var(--border)] pt-3 text-xs text-[var(--ink-muted)]">
        Ranked against {competitorDescriptor}.
      </p>
    </div>
  );
}

function BenchmarkingPanel({
  property,
  benchmark,
  internalDelta,
  portfolioAverage,
}) {
  if (!property || !benchmark) {
    return (
      <Card>
        <SectionHeader
          act="Compare"
          title="Benchmarking"
          description="How this property sits against the rest of your portfolio and the local market."
        />
        <p className="px-6 py-16 text-center text-sm text-[var(--ink-muted)]">
          Select an action item to benchmark its property.
        </p>
      </Card>
    );
  }

  return (
    <Card>
      <SectionHeader
        act="Compare"
        title="Benchmarking"
        description={`How ${property.name} sits against the rest of your portfolio and the local market.`}
      />

      <div className="space-y-5 px-6 py-5">
        <div className="grid gap-5 sm:grid-cols-2">
          <InternalBenchmark internalDelta={internalDelta} portfolioAverage={portfolioAverage} />
          <ExternalBenchmark
            percentile={benchmark.externalPercentile}

        </div>

        <CompetitiveGap benchmark={benchmark} />
      </div>

}

/**
 * ReviewLoop dashboard.
 *
 * All state lives here and flows down; every panel below is presentational.
 * With a dataset this size there is no need for reducers, context or memoisation
 * — derived values are recomputed on each render from the same pure helpers,
 * which keeps the data flow readable end to end.
 *
 * The dashboard is one continuous argument in three acts:
 *   Act     — a specific task, traced to a guest's words
 *   Prove   — did that task move the rating, and is the sample big enough to say so
 *   Compare — where the local market is still ahead, and what it does differently
 *
 * Selecting an action item in Act re-scopes both Prove and Compare, so the three
 * panels always describe the same decision rather than three unrelated views.
 */

/** The action the demo opens on — the clearest end-to-end ROI story in the data. */
const DEFAULT_SELECTED_ACTION_ID = 'ai-001';

function App() {
  const [filters, setFilters] = useState({
    propertyId: ALL_FILTER_VALUE,
    category: ALL_FILTER_VALUE,
    status: ALL_FILTER_VALUE,
  });
  const [selectedActionId, setSelectedActionId] = useState(DEFAULT_SELECTED_ACTION_ID);

  // In-session edits, keyed by action id: { [actionId]: 'YYYY-MM-DD' }.
  const [implementationOverrides, setImplementationOverrides] = useState({});

  // Pricing prompts a manager has waved away, keyed by property id.
  const [dismissedPricingPropertyIds, setDismissedPricingPropertyIds] = useState([]);

  // --- Derived data -------------------------------------------------------
  // Source records first, then the user's edits, then the active filters.
  const resolvedActionItems = applyImplementationOverrides(actionItems, implementationOverrides);
  const visibleActionItems = filterActionItems(resolvedActionItems, filters);

  const selectedAction =
    resolvedActionItems.find((actionItem) => actionItem.id === selectedActionId) ?? null;
  const selectedProperty = selectedAction
    ? (properties.find((property) => property.id === selectedAction.propertyId) ?? null)
    : null;

  const portfolioImpact = calculatePortfolioImpact(properties, resolvedActionItems);
  const portfolioAverageRating = calculatePortfolioAverageRating(properties);

  const selectedBenchmark = selectedProperty ? benchmarks[selectedProperty.id] : null;
  const selectedPricingRecommendation = selectedProperty
    ? pricingRecommendations[selectedProperty.id]
    : null;

  // --- Handlers -----------------------------------------------------------

  /** Narrow one filter dimension while leaving the others untouched. */
  function handleFilterChange(dimension, value) {
    setFilters((previousFilters) => ({ ...previousFilters, [dimension]: value }));
  }

  /** Record the date a fix went live — the pivot the ROI chart splits on. */
  function handleMarkImplemented(actionId, implementedDate) {
    setImplementationOverrides((previousOverrides) => ({
      ...previousOverrides,
      [actionId]: implementedDate,
    }));
  }

  /** Hide a pricing prompt for one property for the rest of the session. */
  function handleDismissPricing(propertyId) {
    setDismissedPricingPropertyIds((previousIds) =>
      previousIds.includes(propertyId) ? previousIds : [...previousIds, propertyId],
    );
  }

  return (
    <div className="min-h-full bg-[var(--page)]">
      <DashboardHeader propertyCount={properties.length} />

      <main className="mx-auto max-w-6xl space-y-6 px-6 py-8">
        <PortfolioHeroMetric impact={portfolioImpact} propertyCount={properties.length} />

        <ActionItemsPanel
          properties={properties}
          visibleActionItems={visibleActionItems}
          totalActionCount={resolvedActionItems.length}
          filters={filters}
          onFilterChange={handleFilterChange}
          selectedActionId={selectedActionId}
          onSelectAction={setSelectedActionId}
        />

        <EffectivenessTracker
          selectedAction={selectedAction}
          property={selectedProperty}
          pricingRecommendation={selectedPricingRecommendation}
          isPricingDismissed={
            selectedProperty ? dismissedPricingPropertyIds.includes(selectedProperty.id) : false
          }
          onMarkImplemented={handleMarkImplemented}
          onDismissPricing={handleDismissPricing}
        />

        <BenchmarkingPanel
          property={selectedProperty}
          benchmark={selectedBenchmark}
          internalDelta={
            selectedProperty ? calculateInternalDelta(selectedProperty, properties) : 0
          }
          portfolioAverage={portfolioAverageRating}
        />

        <footer className="pt-2 pb-6 text-center text-xs text-[var(--ink-muted)]">
          Frontend mockup · all data is fictional · competitor properties are anonymised by type
          and distance only
        </footer>
      </main>
    </div>
  );
}

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
